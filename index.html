<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helferliste Mini-Spielfest</title>
  <meta name="description" content="Helferliste für das Mini-Spielfest von Handball in Viernheim – einfach Namen eintragen.">
  <meta name="theme-color" content="#0b3a7a">
  <link rel="preload" href="fonts/source-sans-3-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230b3a7a'/%3E%3Cpath d='M32 2a30 30 0 0 1 0 60' fill='%2300a19a'/%3E%3C/svg%3E">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="kicker" id="verein"></div>
      <h1 id="title">Helferliste</h1>
      <div class="meta" id="meta"></div>
    </div>
  </header>

  <main class="wrap" id="main">
    <section class="card lead" id="lead">
      <div class="skeleton" style="height:56px;margin:0"></div>
    </section>

    <section id="mine" class="mine hidden" aria-live="polite"></section>

    <div class="toolbar">
      <label class="switch">
        <input type="checkbox" id="filterFree">
        <span>Nur offene Plätze zeigen</span>
      </label>
      <span class="muted small" id="updated"></span>
    </div>

    <section id="spenden"></section>
    <section id="schichten">
      <div class="skeleton"></div><div class="skeleton"></div>
    </section>
  </main>

  <footer class="site">
    <div class="wrap">
      <details class="privacy">
        <summary>Datenschutz</summary>
        <div id="privacyText"></div>
      </details>
      <p class="small" id="footerLinks"></p>
    </div>
  </footer>

  <dialog id="signupDlg" aria-labelledby="dlgTitle">
    <form id="signupForm" method="dialog" novalidate>
      <div class="dlg-head">
        <p class="dlg-kicker" id="dlgKicker"></p>
        <h2 id="dlgTitle">Eintragen</h2>
      </div>
      <div class="dlg-body">
        <div class="error hidden" id="formError" role="alert"></div>
        <label class="field">Dein Name
          <input name="name" autocomplete="name" required minlength="2" maxlength="60" placeholder="z. B. Leni S.">
        </label>
        <p class="muted small" style="margin:0">
          Der Name erscheint öffentlich in dieser Liste. Vorname und Anfangsbuchstabe reichen.
        </p>
      </div>
      <div class="dlg-foot">
        <button type="button" class="btn ghost" data-close>Abbrechen</button>
        <button type="submit" class="btn" id="submitBtn">Eintragen</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
